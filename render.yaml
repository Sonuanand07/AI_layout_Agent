services:
  - type: static_site
    name: ai-layout-agent
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://layout-agent-server-6a1m.onrender.com

  - type: web
    name: layout-agent-server
    runtime: node
    runtimeVersion: 18
    plan: free
    buildCommand: "cd server && npm install"
    startCommand: "cd server && node index.js"
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: build
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://ai-layout-agent-prwz.onrender.com"
