services:
  - type: web
    name: layout-agent
    runtime: node
    runtimeVersion: 18
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: ANTHROPIC_API_KEY
        scope: build
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
